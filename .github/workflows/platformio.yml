name: PlatformIO

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/platformio.yml"
      - 'components/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'dependencies.lock'
      - 'platformio.ini'
      - 'sdkconfig.defaults'
    types:
      - opened
      - synchronize
  workflow_call:
  workflow_dispatch:

jobs:
  compilation-firmware:
    name: Verify Firmware Compilation
    permissions:
        contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: Cache Data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: |
            ~/.cache/pip
            ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
      with:
        python-version: '3.12'

    - name: PlatformIO Installation
      run: pip install --upgrade platformio

    - name: Verify Firmware Compilation
      run: pio run -e development

    - name: Upload Firmware
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
      with:
        name: firmware
        path: .pio/build/development/firmware.bin
        if-no-files-found: error
